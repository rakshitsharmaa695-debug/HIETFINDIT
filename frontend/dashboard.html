<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - HIETFINDIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #f8fafc; }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Premium Navbar -->
  <nav class="bg-white/95 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
    <a href="index.html" class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition">
      <div class="bg-indigo-600 p-1.5 rounded-lg text-white font-black text-xs shadow-sm">HF</div>
      <h1 class="text-lg font-black tracking-tight text-slate-900">HIET<span class="text-indigo-600">FINDIT</span></h1>
    </a>
    
    <!-- Top Navigation Links -->
    <div class="hidden lg:flex items-center space-x-8">
       <a href="faculty.html" class="flex items-center gap-1.5 text-slate-600 hover:text-indigo-600 font-bold text-sm transition-colors"><i data-lucide="users" class="w-4 h-4"></i> Faculty</a>
       <a href="complaints.html" class="flex items-center gap-1.5 text-slate-600 hover:text-indigo-600 font-bold text-sm transition-colors"><i data-lucide="message-square-warning" class="w-4 h-4"></i> Complaints</a>
       <a href="transport.html" class="flex items-center gap-1.5 text-slate-600 hover:text-indigo-600 font-bold text-sm transition-colors"><i data-lucide="bus" class="w-4 h-4"></i> Transport</a>
       <a href="lost-found.html" class="flex items-center gap-1.5 text-slate-600 hover:text-indigo-600 font-bold text-sm transition-colors"><i data-lucide="search" class="w-4 h-4"></i> Lost & Found</a>
    </div>

    <div class="flex items-center gap-4">
      <span class="hidden sm:block text-xs font-bold text-slate-400 uppercase tracking-widest border-r border-slate-200 pr-4">My Dashboard</span>
      <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2 border border-red-100">
        Logout <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>
    </div>
  </nav>

  <!-- Main Profile Area (Centered & Premium) -->
  <main class="flex-1 max-w-4xl mx-auto w-full p-6 lg:p-10 fade-in">
    
    <div class="mb-8 text-center sm:text-left">
      <h2 class="text-3xl font-black text-slate-900 tracking-tight">Student Profile</h2>
      <p class="text-slate-500 mt-1 font-medium">Manage your academic identity and personal details.</p>
    </div>
        
    <!-- Profile Card with Photo Upload -->
    <div class="bg-slate-900 rounded-[2rem] p-8 sm:p-10 text-white shadow-2xl relative overflow-hidden flex flex-col sm:flex-row items-center sm:items-start gap-8 mb-8">
      
      <!-- Abstract Background Element -->
      <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-indigo-500 opacity-20 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>
      
      <!-- Interactive Photo Upload -->
      <div class="relative group cursor-pointer z-10 shrink-0" onclick="document.getElementById('photoInput').click()">
        <div class="w-32 h-32 bg-slate-800 rounded-full flex items-center justify-center border-4 border-slate-700 shadow-xl overflow-hidden transition-all group-hover:border-indigo-500">
          <img id="profileImage" src="" class="w-full h-full object-cover hidden" alt="Profile Photo">
          <i id="defaultAvatar" data-lucide="user" class="w-12 h-12 text-slate-400"></i>
        </div>
        <!-- Hover Overlay -->
        <div class="absolute inset-0 bg-slate-900/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-sm">
          <i data-lucide="camera" class="w-8 h-8 text-white"></i>
        </div>
        <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-indigo-600 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider opacity-0 group-hover:opacity-100 transition-opacity shadow-md">Upload</div>
      </div>
      <input type="file" id="photoInput" class="hidden" accept="image/*">

      <div class="text-center sm:text-left z-10 mt-2">
        <h3 id="profileName" class="text-4xl font-black tracking-tight mb-2 text-white">Loading...</h3>
        <p id="profileEmail" class="text-slate-300 font-medium mb-4 flex items-center justify-center sm:justify-start gap-2">
          <i data-lucide="mail" class="w-4 h-4 text-indigo-400"></i> loading...
        </p>
        <span class="inline-flex items-center gap-1.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest shadow-inner">
          <i data-lucide="shield-check" class="w-4 h-4"></i> Officially Verified
        </span>
      </div>
    </div>

    <!-- Academic Details Form -->
    <div class="bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden">
      <div class="border-b border-slate-100 bg-slate-50/80 px-8 py-6 flex justify-between items-center">
        <div>
          <h4 class="text-xl font-bold text-slate-900">Academic Records</h4>
          <p class="text-sm text-slate-500 mt-1">Keep your college information up to date for official services.</p>
        </div>
        <div class="bg-indigo-50 p-3 rounded-2xl hidden sm:block">
          <i data-lucide="graduation-cap" class="w-6 h-6 text-indigo-600"></i>
        </div>
      </div>
      
      <form id="profileForm" class="p-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-6 mb-8">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Roll Number / ID</label>
            <input type="text" id="stuRoll" placeholder="e.g. HIET2024-001" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl p-4 text-sm font-bold focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all hover:bg-white hover:border-slate-300 shadow-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Course & Branch</label>
            <input type="text" id="stuBranch" placeholder="e.g. B.Tech Computer Science" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl p-4 text-sm font-bold focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all hover:bg-white hover:border-slate-300 shadow-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Current Semester</label>
            <select id="stuSem" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl p-4 text-sm font-bold focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all hover:bg-white hover:border-slate-300 shadow-sm">
              <option value="">Select Semester</option>
              <option value="1">1st Semester</option><option value="2">2nd Semester</option>
              <option value="3">3rd Semester</option><option value="4">4th Semester</option>
              <option value="5">5th Semester</option><option value="6">6th Semester</option>
              <option value="7">7th Semester</option><option value="8">8th Semester</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Phone Number</label>
            <input type="tel" id="stuPhone" placeholder="+91 XXXXX XXXXX" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl p-4 text-sm font-bold focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all hover:bg-white hover:border-slate-300 shadow-sm">
          </div>
        </div>
        
        <div class="flex items-center justify-between border-t border-slate-100 pt-6">
          <div id="saveMsg" class="opacity-0 transition-opacity duration-300 flex items-center gap-2 text-sm font-bold text-emerald-600 bg-emerald-50 px-4 py-2 rounded-lg border border-emerald-100">
            <i data-lucide="check-circle-2" class="w-5 h-5"></i> Profile Saved!
          </div>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3.5 rounded-xl text-sm font-bold shadow-lg shadow-indigo-200 transition-all flex items-center gap-2 transform hover:-translate-y-0.5">
            Save Details <i data-lucide="save" class="w-4 h-4"></i>
          </button>
        </div>
      </form>
    </div>

  </main>

  <script>
    lucide.createIcons();
    
    // Auth Check
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');
    if(!token || !userStr) { window.location.href = 'login.html'; }
    
    // 1. Load Main User Data (From DB Login)
    const user = JSON.parse(userStr);
    document.getElementById('profileName').textContent = user.name;
    document.getElementById('profileEmail').innerHTML = `<i data-lucide="mail" class="w-4 h-4 text-indigo-400"></i> ${user.email}`;
    lucide.createIcons();

    // 2. Load Extra Academic Data & Photo
    const savedProfile = JSON.parse(localStorage.getItem('hiet_academic_profile')) || {};
    if(savedProfile.roll) document.getElementById('stuRoll').value = savedProfile.roll;
    if(savedProfile.branch) document.getElementById('stuBranch').value = savedProfile.branch;
    if(savedProfile.sem) document.getElementById('stuSem').value = savedProfile.sem;
    if(savedProfile.phone) document.getElementById('stuPhone').value = savedProfile.phone;
    
    // Load saved photo if exists
    if(savedProfile.photo) {
      document.getElementById('profileImage').src = savedProfile.photo;
      document.getElementById('profileImage').classList.remove('hidden');
      document.getElementById('defaultAvatar').classList.add('hidden');
    }

    // 3. Handle Photo Upload Logic (Converts image to Base64 and saves it)
    document.getElementById('photoInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if(file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const base64Photo = event.target.result;
          
          // Update UI
          document.getElementById('profileImage').src = base64Photo;
          document.getElementById('profileImage').classList.remove('hidden');
          document.getElementById('defaultAvatar').classList.add('hidden');
          
          // Save to LocalStorage immediately
          const tempProfile = JSON.parse(localStorage.getItem('hiet_academic_profile')) || {};
          tempProfile.photo = base64Photo;
          localStorage.setItem('hiet_academic_profile', JSON.stringify(tempProfile));
        };
        reader.readAsDataURL(file);
      }
    });

    // 4. Handle Form Submit (Save Data locally)
    document.getElementById('profileForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const currentProfile = JSON.parse(localStorage.getItem('hiet_academic_profile')) || {};
      currentProfile.roll = document.getElementById('stuRoll').value;
      currentProfile.branch = document.getElementById('stuBranch').value;
      currentProfile.sem = document.getElementById('stuSem').value;
      currentProfile.phone = document.getElementById('stuPhone').value;
      
      localStorage.setItem('hiet_academic_profile', JSON.stringify(currentProfile));
      
      // Show Success Message with animation
      const msg = document.getElementById('saveMsg');
      msg.classList.remove('opacity-0');
      setTimeout(() => { msg.classList.add('opacity-0'); }, 3000);
    });

    // 5. Logout Function
    function logout() { 
      localStorage.removeItem('token'); 
      localStorage.removeItem('user'); 
      window.location.href = 'login.html'; 
    }
  </script>
</body>
</html>

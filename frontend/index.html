<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus - HIETFINDIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #f8fafc; }
    .modal-enter { animation: modalIn 0.3s ease-out forwards; }
    .modal-exit { animation: modalOut 0.3s ease-in forwards; }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(-10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes modalOut { from { opacity: 1; transform: scale(1) translateY(0); } to { opacity: 0; transform: scale(0.95) translateY(-10px); } }
  </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- Navbar -->
  <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 p-2 rounded-lg text-white font-black text-xs shadow-md">HF</div>
      <h1 class="text-xl font-black tracking-tight text-slate-900">HIET<span class="text-indigo-600">FINDIT</span></h1>
    </div>
    
    <!-- Centered Nav Links (Mandatory Login Protected) -->
    <div class="hidden md:flex items-center gap-6">
      <button onclick="navigate('courses.html')" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 flex items-center gap-1.5 transition-colors"><i data-lucide="book-open" class="w-4 h-4"></i> Courses</button>
      <button onclick="navigate('timetable.html')" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 flex items-center gap-1.5 transition-colors"><i data-lucide="calendar" class="w-4 h-4"></i> Timetable</button>
      <button onclick="navigate('faculty.html')" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 flex items-center gap-1.5 transition-colors"><i data-lucide="users" class="w-4 h-4"></i> Faculty</button>
      <button onclick="navigate('support.html')" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 flex items-center gap-1.5 transition-colors"><i data-lucide="message-square" class="w-4 h-4"></i> Support</button>
      <button onclick="navigate('transport.html')" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 flex items-center gap-1.5 transition-colors"><i data-lucide="bus" class="w-4 h-4"></i> Transport</button>
    </div>

    <!-- Dynamic Navbar Actions (Login / Dashboard) -->
    <div id="navActions" class="flex items-center gap-3">
      <button onclick="openAuthModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-md transition-all flex items-center gap-2">
        Login / Register <i data-lucide="log-in" class="w-4 h-4"></i>
      </button>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="flex-1 max-w-7xl mx-auto w-full p-6 lg:p-12 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
    
    <!-- Left Text Area -->
    <div>
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 text-[10px] font-bold mb-6 border border-indigo-100 tracking-widest uppercase">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-600 animate-pulse"></span> Digital Campus Network
      </div>
      <h2 class="text-5xl lg:text-7xl font-black text-slate-900 tracking-tight leading-[1.1] mb-6">
        Welcome to <br><span class="text-indigo-600">HIETFINDIT.</span>
      </h2>
      <p class="text-lg text-slate-500 mb-10 max-w-lg">
        Your central hub for all campus services. Explore our top courses, find faculty details, and manage your academic life seamlessly.
      </p>
      
      <div class="flex flex-col sm:flex-row items-center gap-4">
        <button onclick="navigate('dashboard.html')" class="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg transition-all flex items-center justify-center gap-2">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Go to Dashboard
        </button>
        <button onclick="navigate('courses.html')" class="w-full sm:w-auto bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 px-8 py-3.5 rounded-xl font-bold shadow-sm transition-all flex items-center justify-center gap-2">
          <i data-lucide="book-open" class="w-5 h-5"></i> Explore Courses
        </button>
      </div>
    </div>

    <!-- Right Image Area -->
    <div class="relative">
      <div class="absolute -inset-4 bg-indigo-100 rounded-3xl blur-2xl opacity-50 -z-10"></div>
      
      <div class="bg-white rounded-3xl p-4 shadow-xl border border-slate-100 relative">
        <img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="College Campus" class="w-full h-[400px] object-cover rounded-2xl">
        
        <div class="absolute -bottom-5 left-1/2 -translate-x-1/2 bg-white px-6 py-2 rounded-full shadow-lg border border-slate-100 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span class="text-xs font-bold text-slate-700 uppercase tracking-widest">Campus Portal Active</span>
        </div>
      </div>
    </div>
  </main>


  <!-- ========================================== -->
  <!-- AUTHENTICATION MODAL (POPUP) -->
  <!-- ========================================== -->
  <div id="authModalOverlay" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div id="authModal" class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8 relative">
      
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-50 hover:bg-slate-100 p-2 rounded-full transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-600 rounded-xl text-white font-black text-lg shadow-lg mb-3">HF</div>
        <h3 class="text-2xl font-black text-slate-900" id="modalTitle">Welcome Back</h3>
        <p class="text-sm text-slate-500 mt-1 font-medium" id="modalDesc">Sign in to your portal</p>
      </div>

      <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
        <button type="button" onclick="switchAuthMode('login')" id="tabLogin" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all">Login</button>
        <button type="button" onclick="switchAuthMode('register')" id="tabRegister" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all">Register</button>
      </div>

      <form id="authForm" class="space-y-4">
        <div id="nameField" class="hidden">
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Full Name</label>
          <input type="text" id="authName" placeholder="Your Name" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
            <input type="email" id="authEmail" required placeholder="you@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 pl-10 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
            <input type="password" id="authPassword" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 pl-10 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div id="authAlert" class="hidden p-3 rounded-lg text-xs font-bold text-center"></div>

        <button type="submit" id="authSubmitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 mt-2">
          Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const API_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://hietfindit-lqzt.onrender.com/api';
    
    let isLoginMode = true;
    let pendingNavigation = null;

    // MANDATORY LOGIN ROUTER
    function navigate(targetUrl) {
      const token = localStorage.getItem('token');
      const userStr = localStorage.getItem('user');

      if (token && userStr) {
        if(targetUrl === 'dashboard.html') {
          const user = JSON.parse(userStr);
          window.location.href = user.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
        } else {
          window.location.href = targetUrl;
        }
      } else {
        pendingNavigation = targetUrl;
        showAlert('🔒 Please login to access this feature.', true);
        openAuthModal();
      }
    }

    // CHECK LOGIN STATE ON PAGE LOAD
    function checkAuthState() {
      const token = localStorage.getItem('token');
      const userStr = localStorage.getItem('user');
      const navActions = document.getElementById('navActions');

      if (token && userStr) {
        const user = JSON.parse(userStr);
        if(user.role === 'admin') {
          navActions.innerHTML = `
            <button onclick="navigate('admin-dashboard.html')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-md transition-all flex items-center gap-2">Admin Panel <i data-lucide="shield" class="w-4 h-4"></i></button>
            <button onclick="logout()" class="bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 px-3 py-2 rounded-lg text-sm font-bold transition-all" title="Logout"><i data-lucide="log-out" class="w-4 h-4"></i></button>
          `;
        } else {
          navActions.innerHTML = `
            <button onclick="navigate('dashboard.html')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-md transition-all flex items-center gap-2">My Dashboard <i data-lucide="layout-dashboard" class="w-4 h-4"></i></button>
            <button onclick="logout()" class="bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 px-3 py-2 rounded-lg text-sm font-bold transition-all" title="Logout"><i data-lucide="log-out" class="w-4 h-4"></i></button>
          `;
        }
        lucide.createIcons();
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.reload(); 
    }

    // MODAL UI LOGIC
    const overlay = document.getElementById('authModalOverlay');
    const modal = document.getElementById('authModal');

    function openAuthModal() {
      overlay.classList.remove('hidden');
      modal.classList.remove('modal-exit');
      modal.classList.add('modal-enter');
    }

    function closeAuthModal() {
      modal.classList.remove('modal-enter');
      modal.classList.add('modal-exit');
      setTimeout(() => { 
        overlay.classList.add('hidden'); 
        hideAlert();
        pendingNavigation = null;
      }, 280);
    }

    function switchAuthMode(mode) {
      isLoginMode = mode === 'login';
      const nameField = document.getElementById('nameField');
      const submitBtn = document.getElementById('authSubmitBtn');
      
      if(isLoginMode) {
        nameField.classList.add('hidden');
        document.getElementById('authName').removeAttribute('required');
        submitBtn.innerHTML = 'Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>';
        document.getElementById('modalTitle').innerText = 'Welcome Back';
        document.getElementById('modalDesc').innerText = 'Sign in to your portal';
        
        document.getElementById('tabLogin').className = 'flex-1 py-2 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all';
        document.getElementById('tabRegister').className = 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all';
      } else {
        nameField.classList.remove('hidden');
        document.getElementById('authName').setAttribute('required', 'true');
        submitBtn.innerHTML = 'Create Account <i data-lucide="user-plus" class="w-4 h-4"></i>';
        document.getElementById('modalTitle').innerText = 'Join HIETFINDIT';
        document.getElementById('modalDesc').innerText = 'Create your student account';
        
        document.getElementById('tabRegister').className = 'flex-1 py-2 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all';
        document.getElementById('tabLogin').className = 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all';
      }
      lucide.createIcons();
      hideAlert();
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('authAlert');
      box.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-600');
      box.classList.add(isError ? 'bg-red-50' : 'bg-emerald-50');
      box.classList.add(isError ? 'text-red-600' : 'text-emerald-600');
      box.innerText = msg;
    }
    function hideAlert() { document.getElementById('authAlert').classList.add('hidden'); }

    // API CALL (LOGIN / REGISTER)
    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      
      const btn = document.getElementById('authSubmitBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="animate-pulse">Processing...</span>';
      btn.disabled = true;

      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      
      let bodyData = { email, password };
      const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
      
      if(!isLoginMode) {
        bodyData.name = document.getElementById('authName').value.trim();
        bodyData.role = 'student'; 
      }

      try {
        const response = await fetch(`${API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });
        
        const data = await response.json();

        if(response.ok) {
          if(!isLoginMode) {
            showAlert('✅ Registration successful! Please login.', false);
            document.getElementById('authForm').reset();
            setTimeout(() => switchAuthMode('login'), 2000);
          } else {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            
            closeAuthModal();
            checkAuthState(); 

            if (pendingNavigation) {
              navigate(pendingNavigation);
            } else if (data.user.role === 'admin') {
              window.location.href = 'admin-dashboard.html';
            }
          }
        } else {
          showAlert(data.error || 'Authentication failed. Please try again.');
        }
      } catch (err) {
        showAlert('❌ Server is down or unreachable. Check connection.');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
        lucide.createIcons();
      }
    });

    checkAuthState();
  </script>
</body>
</html>

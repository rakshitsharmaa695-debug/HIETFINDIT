<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus - HIETFINDIT</title>
  
  <!-- 🚀 THE ADMIN BOUNCER: Page load hone se pehle hi Admin ko bahar fek dega -->
  <script>
    const checkToken = localStorage.getItem('token');
    const checkUserStr = localStorage.getItem('user');
    if (checkToken && checkUserStr) {
      const u = JSON.parse(checkUserStr);
      if (u.role === 'admin') {
        window.location.replace('admin-dashboard.html'); // Instant Redirect to Admin Panel
      }
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0a0f1c; }
    .modal-enter { animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .modal-exit { animation: modalOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(-20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes modalOut { from { opacity: 1; transform: scale(1) translateY(0); } to { opacity: 0; transform: scale(0.95) translateY(-20px); } }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0px); } }
    .floating-card { animation: float 6s ease-in-out infinite; }
    .text-gradient { background: linear-gradient(135deg, #a5b4fc, #60a5fa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    .dark-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
    .dark-input:focus { border-color: #818cf8; background: rgba(15, 23, 42, 0.9); outline: none; box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.2); }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col relative overflow-x-hidden selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- Cinematic Immersive Background -->
  <div class="fixed inset-0 w-full h-full -z-20 overflow-hidden bg-[#0a0f1c]">
    <img src="1789033601541.jpg" alt="Background Blur" class="absolute inset-0 w-full h-full object-cover scale-110 filter blur-[60px] opacity-30 mix-blend-lighten">
    <div class="absolute inset-0 bg-gradient-to-br from-[#0a0f1c]/90 via-indigo-950/60 to-[#0a0f1c]/95"></div>
  </div>

  <!-- Premium Glassmorphism Navbar -->
  <nav class="bg-[#0a0f1c]/50 backdrop-blur-xl border-b border-white/10 px-6 py-4 flex justify-between items-center shadow-2xl sticky top-0 z-40 transition-all">
    <div class="flex items-center gap-3 cursor-pointer group" onclick="window.location.reload()">
      <div class="bg-gradient-to-br from-indigo-500 to-blue-500 p-2 rounded-xl text-white font-black text-xs shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition-transform">HF</div>
      <h1 class="text-xl font-black tracking-tight text-white">HIET<span class="text-indigo-400">FINDIT</span></h1>
    </div>
    
    <!-- Desktop Nav Links (UPDATED: Support and Lost & Found Added Here) -->
    <div class="hidden lg:flex items-center gap-6 bg-white/5 px-6 py-2.5 rounded-full border border-white/5 shadow-inner">
      <button onclick="navigate('courses.html')" class="text-sm font-bold text-slate-300 hover:text-white flex items-center gap-1.5 transition-colors"><i data-lucide="book-open" class="w-4 h-4 text-indigo-400"></i> Courses</button>
      <button onclick="navigate('timetable.html')" class="text-sm font-bold text-slate-300 hover:text-white flex items-center gap-1.5 transition-colors"><i data-lucide="calendar" class="w-4 h-4 text-indigo-400"></i> Timetable</button>
      <button onclick="navigate('faculty.html')" class="text-sm font-bold text-slate-300 hover:text-white flex items-center gap-1.5 transition-colors"><i data-lucide="users" class="w-4 h-4 text-indigo-400"></i> Faculty</button>
      <button onclick="navigate('transport.html')" class="text-sm font-bold text-slate-300 hover:text-white flex items-center gap-1.5 transition-colors"><i data-lucide="bus" class="w-4 h-4 text-indigo-400"></i> Transport</button>
      <button onclick="navigate('complaints.html')" class="text-sm font-bold text-slate-300 hover:text-white flex items-center gap-1.5 transition-colors"><i data-lucide="message-square-warning" class="w-4 h-4 text-rose-400"></i> Support</button>
      <button onclick="navigate('lost-found.html')" class="text-sm font-bold text-slate-300 hover:text-white flex items-center gap-1.5 transition-colors"><i data-lucide="box" class="w-4 h-4 text-emerald-400"></i> Lost & Found</button>
    </div>

    <!-- Right Side Actions & Mobile Hamburger -->
    <div class="flex items-center gap-3">
      <div id="navActions" class="hidden sm:flex items-center gap-3">
        <button onclick="openAuthModal()" class="bg-white/10 hover:bg-white/20 border border-white/10 backdrop-blur-md text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-lg transition-all flex items-center gap-2 transform hover:-translate-y-0.5">
          Login / Register <i data-lucide="log-in" class="w-4 h-4"></i>
        </button>
      </div>
      <!-- Hamburger Menu (Visible on smaller screens) -->
      <button onclick="toggleMobileMenu()" class="lg:hidden p-2 text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg transition-all">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
    </div>
  </nav>

  <!-- Dark Theme Mobile Menu -->
  <div id="mobileMenu" class="fixed inset-y-0 right-0 w-72 bg-[#0a0f1c]/95 backdrop-blur-2xl shadow-2xl border-l border-white/10 z-50 transform translate-x-full transition-transform duration-300 flex flex-col p-6 overflow-y-auto">
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
      <h2 class="font-black text-lg text-white">Menu</h2>
      <button onclick="toggleMobileMenu()" class="p-2 text-slate-400 hover:text-red-400 bg-white/5 hover:bg-red-500/20 rounded-full transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="flex flex-col gap-2 flex-1">
      <button onclick="navigate('courses.html')" class="text-left font-bold text-slate-300 p-3.5 rounded-xl hover:bg-white/10 hover:text-white flex items-center gap-3 transition-colors"><i data-lucide="book-open" class="w-5 h-5 text-indigo-400"></i> Courses</button>
      <button onclick="navigate('timetable.html')" class="text-left font-bold text-slate-300 p-3.5 rounded-xl hover:bg-white/10 hover:text-white flex items-center gap-3 transition-colors"><i data-lucide="calendar" class="w-5 h-5 text-indigo-400"></i> Timetable</button>
      <button onclick="navigate('faculty.html')" class="text-left font-bold text-slate-300 p-3.5 rounded-xl hover:bg-white/10 hover:text-white flex items-center gap-3 transition-colors"><i data-lucide="users" class="w-5 h-5 text-indigo-400"></i> Faculty</button>
      <button onclick="navigate('transport.html')" class="text-left font-bold text-slate-300 p-3.5 rounded-xl hover:bg-white/10 hover:text-white flex items-center gap-3 transition-colors"><i data-lucide="bus" class="w-5 h-5 text-indigo-400"></i> Transport</button>
      <button onclick="navigate('complaints.html')" class="text-left font-bold text-slate-300 p-3.5 rounded-xl hover:bg-rose-500/10 hover:text-rose-400 flex items-center gap-3 transition-colors"><i data-lucide="message-square-warning" class="w-5 h-5 text-rose-400"></i> Support</button>
      <button onclick="navigate('lost-found.html')" class="text-left font-bold text-slate-300 p-3.5 rounded-xl hover:bg-emerald-500/10 hover:text-emerald-400 flex items-center gap-3 transition-colors"><i data-lucide="box" class="w-5 h-5 text-emerald-400"></i> Lost & Found</button>
    </div>
    <div id="mobileNavActions" class="mt-auto pt-4 border-t border-white/10">
      <button onclick="openAuthModal(); toggleMobileMenu();" class="w-full bg-gradient-to-r from-indigo-500 to-blue-500 text-white px-5 py-3.5 rounded-xl text-sm font-bold shadow-lg shadow-indigo-500/30 flex justify-center items-center gap-2">
        Login / Register <i data-lucide="log-in" class="w-4 h-4"></i>
      </button>
    </div>
  </div>
  <div id="mobileOverlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 hidden transition-opacity"></div>

  <!-- Hero Section -->
  <main class="flex-1 max-w-7xl mx-auto w-full p-6 lg:p-12 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center relative z-10 md:mt-8">
    <div class="flex flex-col items-start mt-4 md:mt-0">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-indigo-500/10 text-indigo-300 text-[10px] md:text-xs font-bold mb-6 border border-indigo-400/20 shadow-inner uppercase tracking-wider backdrop-blur-md">
        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-ping absolute"></span>
        <span class="w-2 h-2 rounded-full bg-indigo-400 relative"></span> Digital Campus Network
      </div>
      
      <h2 class="text-4xl sm:text-5xl lg:text-7xl font-black text-white tracking-tight leading-[1.15] mb-4 md:mb-6">
        Welcome to <br><span class="text-gradient">HIETFINDIT.</span>
      </h2>
      <p class="text-base md:text-lg text-slate-300 mb-8 md:mb-10 max-w-lg leading-relaxed font-medium">
        Your central hub for all campus services. Explore our top courses, find faculty details, and manage your academic life seamlessly.
      </p>
      
      <div class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto">
        <button id="heroDashBtn" onclick="navigate('dashboard.html')" class="w-full sm:w-auto bg-gradient-to-r from-indigo-500 to-blue-500 hover:from-indigo-600 hover:to-blue-600 text-white px-8 py-3.5 md:py-4 rounded-xl font-bold shadow-xl shadow-indigo-500/30 flex items-center justify-center gap-2 transition-all transform hover:-translate-y-1">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Go to Dashboard
        </button>
        <button onclick="navigate('courses.html')" class="w-full sm:w-auto bg-white/5 border border-white/20 hover:bg-white/10 hover:border-white/40 text-white px-8 py-3.5 md:py-4 rounded-xl font-bold flex items-center justify-center gap-2 backdrop-blur-md transition-all">
          <i data-lucide="book-open" class="w-5 h-5"></i> Explore Courses
        </button>
      </div>
    </div>

    <!-- Right Image Area -->
    <div class="relative w-full max-w-sm sm:max-w-md md:max-w-lg mx-auto floating-card mt-8 md:mt-0 group">
      <div class="absolute -inset-2 bg-gradient-to-tr from-indigo-500 to-blue-400 rounded-[2.5rem] blur-2xl opacity-40 group-hover:opacity-70 transition-opacity duration-700 -z-10"></div>
      <div class="bg-white/10 backdrop-blur-xl rounded-[2rem] p-2 md:p-3 shadow-2xl border border-white/20 relative z-10">
        <img src="1789033601541.jpg" alt="HIET Campus" class="w-full h-[250px] sm:h-[300px] md:h-[400px] object-cover rounded-[1.5rem] shadow-inner">
        <div class="absolute -bottom-4 md:-bottom-6 left-1/2 -translate-x-1/2 bg-[#0a0f1c]/90 backdrop-blur-md px-5 md:px-6 py-2.5 md:py-3 rounded-full shadow-2xl border border-white/10 flex items-center gap-2 md:gap-3 w-max">
          <span class="relative flex h-2 w-2 md:h-3 md:w-3"><span class="animate-ping absolute h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative rounded-full h-2 w-2 md:h-3 md:w-3 bg-emerald-500"></span></span>
          <span class="text-[10px] md:text-xs font-bold text-white uppercase tracking-widest">Campus Active</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Auth Modal -->
  <div id="authModalOverlay" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-opacity duration-300">
    <div id="authModal" class="bg-[#0f172a]/90 backdrop-blur-2xl w-full max-w-md rounded-[2rem] shadow-2xl p-6 md:p-8 relative border border-white/10 max-h-[90vh] overflow-y-auto">
      
      <div class="absolute -top-20 -right-20 w-40 h-40 bg-indigo-500/20 rounded-full blur-[40px] pointer-events-none"></div>

      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white hover:bg-white/10 p-2 rounded-full transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
      
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 md:w-14 md:h-14 bg-gradient-to-br from-indigo-500 to-blue-500 rounded-2xl text-white font-black text-xl shadow-lg shadow-indigo-500/30 mb-4">HF</div>
        <h3 class="text-xl md:text-2xl font-black text-white" id="modalTitle">Welcome Back</h3>
      </div>
      
      <div class="flex bg-white/5 p-1.5 rounded-xl mb-6 shadow-inner border border-white/5">
        <button type="button" onclick="switchAuthMode('login')" id="tabLogin" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white/10 text-white shadow-sm border border-white/10 transition-all">Login</button>
        <button type="button" onclick="switchAuthMode('register')" id="tabRegister" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all">Register</button>
      </div>
      
      <form id="authForm" class="space-y-4 relative z-10">
        <div id="nameField" class="hidden">
          <div class="relative">
            <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
            <input type="text" id="authName" placeholder="Full Name" class="w-full dark-input rounded-xl py-3.5 pl-11 text-sm font-bold">
          </div>
        </div>
        <div class="relative">
          <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input type="email" id="authEmail" required placeholder="Email Address" class="w-full dark-input rounded-xl py-3.5 pl-11 text-sm font-bold">
        </div>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input type="password" id="authPassword" required placeholder="Password" class="w-full dark-input rounded-xl py-3.5 pl-11 text-sm font-bold">
        </div>
        
        <div id="authAlert" class="hidden p-3 rounded-xl text-xs font-bold text-center border"></div>
        
        <button type="submit" id="authSubmitBtn" class="w-full bg-gradient-to-r from-indigo-500 to-blue-500 hover:from-indigo-600 hover:to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/30 transition-all flex items-center justify-center gap-2 mt-2 transform hover:-translate-y-0.5">
          Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    function toggleMobileMenu() {
      document.getElementById('mobileMenu').classList.toggle('translate-x-full');
      document.getElementById('mobileOverlay').classList.toggle('hidden');
    }

    const API_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://hietfindit-lqzt.onrender.com/api';
    let isLoginMode = true; let pendingNavigation = null;

    function navigate(targetUrl) {
      const token = localStorage.getItem('token');
      if (token) {
        if(targetUrl === 'dashboard.html') {
           const role = JSON.parse(localStorage.getItem('user')).role;
           window.location.href = role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
        } else {
           window.location.href = targetUrl;
        }
      } else {
        pendingNavigation = targetUrl;
        showAlert('🔒 Please login to access this feature.', true);
        openAuthModal();
      }
    }

    function checkAuthState() {
      const token = localStorage.getItem('token');
      const userStr = localStorage.getItem('user');
      if (token && userStr) {
        const user = JSON.parse(userStr);
        const isAdmin = user.role === 'admin';
        
        const dashText = isAdmin ? 'Admin Panel' : 'Dashboard';
        const dashIcon = isAdmin ? 'shield' : 'layout-dashboard';

        const btnHTML = `
          <button onclick="navigate('dashboard.html')" class="w-full sm:w-auto bg-gradient-to-r from-indigo-500 to-blue-500 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-indigo-500/30 flex items-center justify-center gap-2 transition-transform hover:-translate-y-0.5">${dashText} <i data-lucide="${dashIcon}" class="w-4 h-4"></i></button>
          <button onclick="logout()" class="w-full sm:w-auto bg-white/10 hover:bg-red-500/20 border border-white/10 hover:border-red-500/30 text-white hover:text-red-400 px-3.5 py-2.5 rounded-xl text-sm font-bold flex justify-center items-center backdrop-blur-md transition-all" title="Logout"><i data-lucide="log-out" class="w-4 h-4"></i></button>
        `;
        document.getElementById('navActions').innerHTML = btnHTML;
        document.getElementById('mobileNavActions').innerHTML = btnHTML;
        
        const heroBtn = document.getElementById('heroDashBtn');
        if(heroBtn) heroBtn.innerHTML = `<i data-lucide="${dashIcon}" class="w-5 h-5"></i> Go to ${dashText}`;

        lucide.createIcons();
      }
    }

    function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.reload(); }

    function openAuthModal() {
      document.getElementById('authModalOverlay').classList.remove('hidden');
      document.getElementById('authModal').classList.add('modal-enter');
    }
    
    function closeAuthModal() {
      document.getElementById('authModal').classList.replace('modal-enter', 'modal-exit');
      setTimeout(() => { 
        document.getElementById('authModalOverlay').classList.add('hidden'); 
        document.getElementById('authModal').classList.remove('modal-exit'); 
      }, 300);
    }

    function switchAuthMode(mode) {
      isLoginMode = mode === 'login';
      document.getElementById('nameField').classList.toggle('hidden', isLoginMode);
      document.getElementById('authName').required = !isLoginMode;
      document.getElementById('modalTitle').innerText = isLoginMode ? 'Welcome Back' : 'Create Account';
      document.getElementById('authSubmitBtn').innerHTML = isLoginMode ? 'Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>' : 'Create Account <i data-lucide="user-plus" class="w-4 h-4"></i>';
      
      document.getElementById('tabLogin').className = isLoginMode ? 'flex-1 py-2 text-sm font-bold rounded-lg bg-white/10 text-white shadow-sm border border-white/10 transition-all' : 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all';
      document.getElementById('tabRegister').className = !isLoginMode ? 'flex-1 py-2 text-sm font-bold rounded-lg bg-white/10 text-white shadow-sm border border-white/10 transition-all' : 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all';
      
      document.getElementById('authAlert').classList.add('hidden');
      lucide.createIcons();
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('authAlert');
      box.className = `p-3 rounded-xl text-xs font-bold text-center border ${isError ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'}`;
      box.innerText = msg;
      box.classList.remove('hidden');
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('authSubmitBtn'); const originalText = btn.innerHTML;
      btn.innerHTML = 'Processing...'; btn.disabled = true;
      let bodyData = { email: document.getElementById('authEmail').value.trim(), password: document.getElementById('authPassword').value };
      if(!isLoginMode) { bodyData.name = document.getElementById('authName').value.trim(); bodyData.role = 'student'; }

      try {
        const res = await fetch(`${API_URL}${isLoginMode ? '/auth/login' : '/auth/register'}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyData) });
        const data = await res.json();
        if(res.ok) {
          if(!isLoginMode) { 
            showAlert('Registration successful! Please login.', false); 
            setTimeout(() => switchAuthMode('login'), 2000); 
          } else { 
            localStorage.setItem('token', data.token); 
            localStorage.setItem('user', JSON.stringify(data.user)); 

            if(data.user.role === 'admin') {
              window.location.replace('admin-dashboard.html');
            } else if (pendingNavigation) {
              window.location.href = pendingNavigation;
            } else {
              closeAuthModal(); 
              checkAuthState(); 
            }
          }
        } else showAlert(data.error);
      } catch (err) { showAlert('Server unreachable.'); } finally { btn.innerHTML = originalText; btn.disabled = false; lucide.createIcons(); }
    });

    // Run auth check on page load
    checkAuthState();
  </script>
</body>
</html>

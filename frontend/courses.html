<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Courses - HIETFINDIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
    .fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Premium Glass Cards */
    .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .glass-card:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(129, 140, 248, 0.5); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5); }
    
    /* Text Gradient */
    .text-gradient { background: linear-gradient(135deg, #818cf8, #60a5fa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col relative overflow-x-hidden selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- Cinematic Background -->
  <div class="fixed inset-0 w-full h-full -z-20 overflow-hidden bg-slate-950">
    <img src="1789033601541.jpg" alt="Campus Blur" class="absolute inset-0 w-full h-full object-cover scale-110 filter blur-[80px] opacity-30 mix-blend-screen">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/80 via-slate-900/70 to-slate-950/90"></div>
  </div>

  <!-- Glassmorphism Navbar -->
  <nav class="bg-slate-900/40 backdrop-blur-xl border-b border-white/10 px-4 md:px-6 py-4 flex justify-between items-center sticky top-0 z-50 transition-all">
    <a href="index.html" class="bg-white/10 hover:bg-white/20 border border-white/10 text-white px-3 md:px-4 py-2 rounded-xl text-sm font-bold transition-all shadow-sm flex items-center gap-2 group backdrop-blur-md">
      <i data-lucide="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1"></i> <span class="hidden sm:inline">Back to Home</span>
    </a>
    <div class="flex items-center gap-2.5 cursor-pointer" onclick="window.location.href='index.html'">
      <h1 class="text-lg md:text-xl font-black tracking-tight text-white">Explore <span class="text-indigo-400">Courses</span></h1>
      <div class="bg-gradient-to-br from-indigo-500 to-blue-500 p-2 rounded-xl text-white font-black text-xs shadow-lg shadow-indigo-500/30"><i data-lucide="book-open" class="w-4 h-4"></i></div>
    </div>
  </nav>

  <main class="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6 lg:p-10 relative z-20">
    <div class="mb-10 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-4 fade-in">
      <div>
        <h2 class="text-3xl md:text-4xl font-black text-white tracking-tight mb-2">Academic <span class="text-gradient">Programs</span></h2>
        <p class="text-slate-300 font-medium">Discover future-ready degree programs offered by the institution.</p>
      </div>
      <div class="bg-indigo-500/10 text-indigo-300 px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2 border border-indigo-400/30 shadow-lg backdrop-blur-md">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span> Admissions Open 2026
      </div>
    </div>

    <div id="coursesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 items-stretch">
      <!-- Loading Skeleton -->
      <div class="col-span-full flex gap-6 overflow-hidden animate-pulse w-full">
        <div class="w-full glass-card rounded-[1.5rem] h-[400px] flex flex-col">
          <div class="w-full h-48 bg-white/5 rounded-t-[1.5rem]"></div>
          <div class="p-6 flex-1 flex flex-col gap-3">
            <div class="w-3/4 h-6 bg-white/10 rounded-md"></div>
            <div class="w-full h-4 bg-white/5 rounded-md mt-2"></div>
            <div class="w-5/6 h-4 bg-white/5 rounded-md"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();
    const API_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://hietfindit-lqzt.onrender.com/api';

    async function loadCourses() {
      const grid = document.getElementById('coursesGrid');
      try {
        const res = await fetch(`${API_URL}/courses`);
        const data = await res.json();

        if(data.length === 0) {
          grid.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-16 text-slate-300 glass-card rounded-3xl"><div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mb-4 border border-white/10"><i data-lucide="book-x" class="w-10 h-10 text-indigo-400"></i></div><h3 class="text-xl font-black text-white">No Courses Available</h3></div>`;
          lucide.createIcons(); return;
        }

        grid.innerHTML = data.map((c, index) => `
          <div class="glass-card rounded-[1.5rem] p-6 flex flex-col h-full transform transition-all duration-300 hover:-translate-y-1.5 fade-in group" style="animation-delay: ${index * 0.05}s">
            <div class="relative w-full h-48 mb-5 overflow-hidden rounded-2xl">
              <img src="${c.image}" alt="${c.name}" class="absolute inset-0 w-full h-full object-cover shadow-sm group-hover:scale-105 transition-transform duration-500">
              <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 to-transparent opacity-60"></div>
            </div>
            
            <h3 class="text-2xl font-black text-white mb-2 group-hover:text-indigo-400 transition-colors">${c.name}</h3>
            <p class="text-sm text-slate-300 mb-6 flex-grow line-clamp-3 leading-relaxed" title="${c.description}">${c.description}</p>
            
            <div class="space-y-3 mb-6 bg-white/5 p-4 rounded-xl border border-white/5">
              <div class="flex justify-between text-sm border-b border-white/10 pb-2"><span class="text-slate-400 font-bold"><i data-lucide="clock" class="w-3.5 h-3.5 inline mb-0.5"></i> Duration</span><span class="text-white font-bold">${c.duration}</span></div>
              <div class="flex justify-between text-sm border-b border-white/10 pb-2"><span class="text-slate-400 font-bold"><i data-lucide="award" class="w-3.5 h-3.5 inline mb-0.5"></i> Eligibility</span><span class="text-white font-bold">${c.eligibility}</span></div>
              <div class="flex justify-between text-sm pb-1"><span class="text-slate-400 font-bold"><i data-lucide="users" class="w-3.5 h-3.5 inline mb-0.5"></i> Seats</span><span class="text-emerald-400 font-bold">${c.seats}</span></div>
            </div>
            
            <a href="timetable.html" class="w-full bg-gradient-to-r from-indigo-500 to-blue-500 hover:from-indigo-600 hover:to-blue-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-500/30 flex justify-center items-center gap-2 mt-auto transform group-hover:scale-[1.02]">
              View Schedule <i data-lucide="calendar" class="w-4 h-4"></i>
            </a>
          </div>
        `).join('');
        lucide.createIcons();
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center text-red-400 font-bold py-10 glass-card rounded-2xl border border-red-500/20">Failed to load courses from Server.</div>`;
      }
    }
    loadCourses();
  </script>
</body>
</html>

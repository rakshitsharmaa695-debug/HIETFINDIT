<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HIETFINDIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
    .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .dark-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
    .dark-input:focus { border-color: #818cf8; background: rgba(255, 255, 255, 0.1); outline: none; box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.2); }
    .fade-in { animation: fadeIn 0.6s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="text-white h-screen flex items-center justify-center relative overflow-hidden selection:bg-indigo-500/30">

  <!-- Immersive Background -->
  <div class="absolute inset-0 w-full h-full -z-20 overflow-hidden">
    <img src="1789033601541.jpg" class="absolute inset-0 w-full h-full object-cover scale-110 filter blur-[40px] opacity-40 mix-blend-screen">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/60 via-slate-900/80 to-slate-950"></div>
  </div>

  <div class="w-full max-w-md px-4 fade-in">
    <!-- Go Back Button -->
    <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white text-sm font-bold mb-6 transition-colors">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Return Home
    </a>

    <div class="glass-card rounded-[2rem] p-8 shadow-2xl relative overflow-hidden">
      <!-- Glow -->
      <div class="absolute -top-20 -right-20 w-40 h-40 bg-indigo-500/30 rounded-full blur-[40px]"></div>
      
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-br from-indigo-500 to-blue-500 rounded-2xl text-white font-black text-xl shadow-lg shadow-indigo-500/30 mb-4">HF</div>
        <h3 class="text-2xl font-black text-white" id="title">Welcome Back</h3>
        <p class="text-sm text-slate-400 mt-1" id="subtitle">Sign in to your portal</p>
      </div>

      <div class="flex bg-white/5 p-1.5 rounded-xl mb-6">
        <button type="button" onclick="switchMode(true)" id="tabLogin" class="flex-1 py-2.5 text-sm font-bold rounded-lg bg-white/10 text-white shadow-sm border border-white/10 transition-all">Login</button>
        <button type="button" onclick="switchMode(false)" id="tabReg" class="flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all">Register</button>
      </div>

      <form id="authForm" class="space-y-4">
        <div id="nameDiv" class="hidden">
          <div class="relative">
            <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
            <input type="text" id="name" placeholder="Full Name" class="w-full dark-input rounded-xl py-3.5 pl-11 text-sm font-bold">
          </div>
        </div>
        <div class="relative">
          <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input type="email" id="email" required placeholder="Email Address" class="w-full dark-input rounded-xl py-3.5 pl-11 text-sm font-bold">
        </div>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input type="password" id="password" required placeholder="Password" class="w-full dark-input rounded-xl py-3.5 pl-11 text-sm font-bold">
        </div>
        
        <div id="alertBox" class="hidden p-3 rounded-xl text-xs font-bold text-center border"></div>
        
        <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-indigo-500 to-blue-500 hover:from-indigo-600 hover:to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/30 transition-all flex items-center justify-center gap-2 mt-4">
          Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const API_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://hietfindit-lqzt.onrender.com/api';
    let isLogin = true;

    function switchMode(login) {
      isLogin = login;
      document.getElementById('nameDiv').classList.toggle('hidden', isLogin);
      document.getElementById('name').required = !isLogin;
      document.getElementById('title').innerText = isLogin ? 'Welcome Back' : 'Create Account';
      document.getElementById('subtitle').innerText = isLogin ? 'Sign in to your portal' : 'Join the HIET Network';
      document.getElementById('submitBtn').innerHTML = isLogin ? 'Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>' : 'Register Now <i data-lucide="user-plus" class="w-4 h-4"></i>';
      
      document.getElementById('tabLogin').className = isLogin ? 'flex-1 py-2.5 text-sm font-bold rounded-lg bg-white/10 text-white shadow-sm border border-white/10 transition-all' : 'flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all';
      document.getElementById('tabReg').className = !isLogin ? 'flex-1 py-2.5 text-sm font-bold rounded-lg bg-white/10 text-white shadow-sm border border-white/10 transition-all' : 'flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all';
      lucide.createIcons();
    }

    function alertMsg(msg, err=true) {
      const b = document.getElementById('alertBox');
      b.className = `p-3 rounded-xl text-xs font-bold text-center border ${err ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'}`;
      b.innerText = msg; b.classList.remove('hidden');
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn'); const orig = btn.innerHTML;
      btn.innerHTML = 'Processing...'; btn.disabled = true;
      let bodyData = { email: document.getElementById('email').value.trim(), password: document.getElementById('password').value };
      if(!isLogin) { bodyData.name = document.getElementById('name').value.trim(); bodyData.role = 'student'; }

      try {
        const res = await fetch(`${API_URL}${isLogin ? '/auth/login' : '/auth/register'}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(bodyData) });
        const data = await res.json();
        if(res.ok) {
          if(!isLogin) { alertMsg('Success! Please login.', false); setTimeout(()=>switchMode(true), 2000); }
          else { localStorage.setItem('token', data.token); localStorage.setItem('user', JSON.stringify(data.user)); window.location.href = data.user.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html'; }
        } else alertMsg(data.error);
      } catch (err) { alertMsg('Server connection failed.'); } finally { btn.innerHTML = orig; btn.disabled = false; lucide.createIcons(); }
    });
  </script>
</body>
</html>

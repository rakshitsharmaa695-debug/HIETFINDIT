<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HIETFINDIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #f8fafc; }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

  <!-- Background Design -->
  <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-500 rounded-full mix-blend-multiply filter blur-[100px] opacity-40"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-[100px] opacity-40"></div>

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 relative z-10 fade-in border border-slate-100">
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 rounded-2xl text-white font-black text-xl shadow-lg mb-4 shadow-indigo-200">HF</div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Welcome to HIET<span class="text-indigo-600">FINDIT</span></h1>
      <p class="text-sm text-slate-500 mt-1 font-medium" id="formDesc">Sign in to access your portal</p>
    </div>

    <!-- Toggle Login / Register -->
    <div class="flex bg-slate-100 p-1 rounded-xl mb-8">
      <button type="button" onclick="toggleForm('login')" id="tabLogin" class="flex-1 py-2.5 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all">Login</button>
      <button type="button" onclick="toggleForm('register')" id="tabRegister" class="flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all">Register</button>
    </div>

    <form id="authForm" class="space-y-5">

      <!-- Name (Only for Register) -->
      <div id="nameField" class="hidden fade-in">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Full Name</label>
        <input type="text" id="name" placeholder="Your Name" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
      </div>

      <!-- Email -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Email Address</label>
        <div class="relative">
          <i data-lucide="mail" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
          <input type="email" id="email" required placeholder="you@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 pl-11 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Password</label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
          <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 pl-11 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="hidden p-3 rounded-lg text-sm font-bold text-center"></div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2 mt-4">
        Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>

    </form>
    
    <div class="mt-6 text-center">
      <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-indigo-600 flex items-center justify-center gap-1"><i data-lucide="arrow-left" class="w-3 h-3"></i> Back to Homepage</a>
    </div>

  </div>

  <script>
    lucide.createIcons();
    const API_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://hietfindit-lqzt.onrender.com/api';
    
    let isLoginMode = true;

    function toggleForm(mode) {
      isLoginMode = mode === 'login';
      const nameField = document.getElementById('nameField');
      const submitBtn = document.getElementById('submitBtn');
      const desc = document.getElementById('formDesc');
      
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');

      if(isLoginMode) {
        nameField.classList.add('hidden');
        document.getElementById('name').removeAttribute('required');
        
        submitBtn.innerHTML = 'Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>';
        desc.innerText = 'Sign in to access your portal';
        
        tabLogin.className = 'flex-1 py-2.5 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all';
        tabRegister.className = 'flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all';
      } else {
        nameField.classList.remove('hidden');
        document.getElementById('name').setAttribute('required', 'true');
        
        submitBtn.innerHTML = 'Create Account <i data-lucide="user-plus" class="w-4 h-4"></i>';
        desc.innerText = 'Create a new student account';
        
        tabRegister.className = 'flex-1 py-2.5 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all';
        tabLogin.className = 'flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all';
      }
      lucide.createIcons();
      hideAlert();
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alertBox');
      box.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-600');
      box.classList.add(isError ? 'bg-red-50' : 'bg-emerald-50');
      box.classList.add(isError ? 'text-red-600' : 'text-emerald-600');
      box.innerText = msg;
    }

    function hideAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      let bodyData = { email, password };
      const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
      
      if(!isLoginMode) {
        // Hamesha new user ko Student banaya jayega automatically
        bodyData.name = document.getElementById('name').value.trim();
        bodyData.role = 'student'; 
      }

      const btn = document.getElementById('submitBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="animate-pulse">Processing...</span>';
      btn.disabled = true;

      try {
        const response = await fetch(`${API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });
        
        const data = await response.json();

        if(response.ok) {
          if(!isLoginMode) {
            showAlert('✅ Registration successful! Redirecting to login...', false);
            document.getElementById('authForm').reset();
            setTimeout(() => toggleForm('login'), 2000);
          } else {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            
            // SMART ROUTING: DB se role check hoga
            if(data.user.role === 'admin') {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          }
        } else {
          showAlert(data.error || 'Authentication failed. Please try again.');
        }
      } catch (err) {
        showAlert('❌ Server is down or unreachable. Check your connection.');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>

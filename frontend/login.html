<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - HIETFINDIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
    
    <div class="text-center mb-8">
      <h2 class="text-3xl font-black text-slate-800">HIET<span class="text-indigo-600">FINDIT</span></h2>
      <p class="text-slate-500 text-sm mt-1">Smart Campus Portal</p>
    </div>

    <!-- Toggle Buttons -->
    <div class="flex bg-slate-100 p-1 rounded-lg mb-6">
      <button id="showLoginBtn" class="flex-1 bg-white text-indigo-600 shadow font-bold py-2 rounded-md text-sm transition">User</button>
      <button id="showRegBtn" class="flex-1 text-slate-500 hover:text-slate-700 font-bold py-2 rounded-md text-sm transition">Register</button>
      <button id="showAdminBtn" class="flex-1 text-slate-500 hover:text-slate-700 font-bold py-2 rounded-md text-sm transition">Admin</button>
    </div>

    <div id="messageBox" class="hidden mb-4"></div>

    <!-- 1. User Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Email Address</label>
        <input type="email" id="loginEmail" required class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Password</label>
        <input type="password" id="loginPassword" required class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition shadow-md">Sign In</button>
    </form>

    <!-- 2. Register Form (Hidden) -->
    <form id="registerForm" class="hidden space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Full Name</label>
        <input type="text" id="regName" required class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Email</label>
        <input type="email" id="regEmail" required class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Password</label>
        <input type="password" id="regPassword" required class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Role</label>
        <select id="regRole" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="student">Student</option>
          <option value="faculty">Faculty</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition shadow-md">Create Account</button>
    </form>

    <!-- 3. Admin Login Form (Hidden) -->
    <form id="adminLoginForm" class="hidden space-y-4">
      <div class="bg-slate-800 text-white p-3 rounded-lg text-center mb-4 text-sm font-bold">
        Secure Admin Access
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Admin ID</label>
        <input type="email" id="adminId" required class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-slate-800 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Password</label>
        <input type="password" id="adminPass" required class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-slate-800 focus:outline-none">
      </div>
      <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3 rounded-lg transition shadow-md">Login as Admin</button>
    </form>

    <div class="mt-6 text-center">
      <a href="index.html" class="text-sm text-slate-500 hover:text-indigo-600 font-semibold">← Back to Home</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>

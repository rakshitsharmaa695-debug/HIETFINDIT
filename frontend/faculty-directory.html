<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faculty Directory - HIETFINDIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2 rounded-lg text-white font-black shadow-md">HF</div>
        <span class="text-xl font-bold">Faculty <span class="text-indigo-600">Directory</span></span>
      </div>
      <a href="index.html" class="text-sm font-bold text-slate-500 hover:text-indigo-600 flex items-center gap-1 transition">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
      </a>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
    <div class="text-center mb-10">
      <h2 class="text-3xl font-black text-slate-900">Our Esteemed Faculty</h2>
      <p class="text-slate-500 mt-2">Himachal Institute of Engineering and Technology</p>
    </div>
    
    <div id="facultyGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="col-span-full flex justify-center py-10">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const API_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://hietfindit-lqzt.onrender.com/api';

    async function loadDirectory() {
      try {
        const res = await fetch(`${API_URL}/faculty`);
        const data = await res.json();
        const grid = document.getElementById('facultyGrid');
        grid.innerHTML = ''; 

        if(data.length === 0) return grid.innerHTML = '<p class="text-slate-500 text-center col-span-full">No faculty members found.</p>';

        data.forEach(fac => {
          const photoUrl = fac.photo || 'https://via.placeholder.com/150';
          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden hover:shadow-xl transition duration-300';
          card.innerHTML = `
            <div class="h-24 bg-indigo-500"></div>
            <div class="flex justify-center -mt-12 mb-2">
              <img src="${photoUrl}" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-sm bg-white">
            </div>
            <div class="p-5 text-center">
              <h3 class="text-xl font-bold text-slate-800 mb-1">${fac.name}</h3>
              <p class="text-sm font-semibold text-indigo-600 mb-3">${fac.designation}</p>
              <div class="bg-slate-50 rounded-lg p-3 text-left space-y-2 text-sm">
                <div class="flex items-center gap-2 text-slate-600"><i data-lucide="book-open" class="w-4 h-4 text-slate-400"></i> <span class="font-semibold">Dept:</span> ${fac.department}</div>
                <div class="flex items-center gap-2 text-slate-600"><i data-lucide="door-closed" class="w-4 h-4 text-slate-400"></i> <span class="font-semibold">Cabin:</span> ${fac.cabin || 'N/A'}</div>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
        lucide.createIcons();
      } catch (e) { document.getElementById('facultyGrid').innerHTML = '<p class="text-red-500 text-center col-span-full">Error connecting to Database.</p>'; }
    }
    loadDirectory();
  </script>
</body>
</html>

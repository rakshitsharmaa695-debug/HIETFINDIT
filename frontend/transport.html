<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Transport - HIETFINDIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
    .fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    /* Premium Glass Hover */
    .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .glass-card:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5); }
    .ticket-border { border-top: 2px dashed rgba(255,255,255,0.15); }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col relative overflow-x-hidden selection:bg-amber-500/30 selection:text-amber-200">

  <!-- Cinematic Background -->
  <div class="fixed inset-0 w-full h-full -z-20 overflow-hidden bg-slate-950">
    <img src="1789033601541.jpg" class="absolute inset-0 w-full h-full object-cover scale-110 filter blur-[80px] opacity-30 mix-blend-screen">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/80 via-slate-900/70 to-slate-950/90"></div>
  </div>

  <!-- Glassmorphism Navbar -->
  <nav class="bg-slate-900/40 backdrop-blur-xl border-b border-white/10 px-4 md:px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <a href="dashboard.html" class="bg-white/10 hover:bg-white/20 border border-white/10 text-white px-3 md:px-4 py-2 rounded-xl text-sm font-bold transition-all shadow-sm flex items-center gap-2 group backdrop-blur-md">
      <i data-lucide="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1"></i> <span class="hidden sm:inline">Dashboard</span>
    </a>
    <div class="flex items-center gap-2.5 cursor-pointer" onclick="window.location.href='index.html'">
      <h1 class="text-lg md:text-xl font-black tracking-tight text-white">Campus <span class="text-amber-400">Transport</span></h1>
      <div class="bg-gradient-to-br from-amber-400 to-orange-500 p-2 rounded-xl text-white font-black text-xs shadow-lg shadow-amber-500/30"><i data-lucide="bus" class="w-4 h-4"></i></div>
    </div>
  </nav>

  <!-- Hero Header -->
  <div class="py-12 md:py-16 px-4 md:px-6 relative text-center z-10">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-bold border border-amber-400/30 tracking-widest uppercase mb-4 backdrop-blur-md">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span> Live Routes
    </div>
    <h1 class="text-4xl md:text-5xl lg:text-6xl font-black tracking-tight mb-4">Fleet & <span class="text-amber-400">Schedules</span></h1>
    <p class="text-slate-300 max-w-2xl mx-auto text-sm md:text-base px-4 font-medium">Find your daily college bus routes, timing details, and designated stops effortlessly.</p>
  </div>

  <main class="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6 lg:p-10 relative z-20">
    <div id="transportGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 md:gap-8 items-stretch">
      <!-- Loading Skeleton (Dark Mode) -->
      <div class="col-span-full flex gap-6 overflow-hidden animate-pulse w-full">
        <div class="w-full glass-card rounded-[1.5rem] h-96 flex flex-col">
          <div class="w-full h-52 bg-white/5 rounded-t-[1.5rem]"></div>
          <div class="p-6 flex-1 flex flex-col gap-3">
            <div class="w-3/4 h-6 bg-white/10 rounded-md"></div>
            <div class="w-full h-4 bg-white/5 rounded-md mt-2"></div>
            <div class="w-5/6 h-4 bg-white/5 rounded-md"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();
    if(!localStorage.getItem('token')) window.location.href = 'index.html'; 
    const API_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://hietfindit-lqzt.onrender.com/api';
    const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=80&w=800&auto=format&fit=crop';

    async function loadTransport() {
      const grid = document.getElementById('transportGrid');
      try {
        const res = await fetch(`${API_URL}/transport`); const data = await res.json();
        if(data.length === 0) {
          grid.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-16 text-slate-300 glass-card rounded-3xl"><div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mb-4"><i data-lucide="map-x" class="w-10 h-10 text-amber-400"></i></div><h3 class="text-xl font-black text-white">No Routes Available</h3></div>`;
          lucide.createIcons(); return;
        }

        grid.innerHTML = data.map((b, index) => {
          const imgSrc = b.bus_photo ? b.bus_photo : FALLBACK_IMAGE;
          return `
          <div class="glass-card rounded-[1.5rem] overflow-hidden flex flex-col h-full transform transition-all duration-300 hover:-translate-y-1.5 fade-in group" style="animation-delay: ${index * 0.05}s">
            <div class="w-full h-52 sm:h-56 relative shrink-0 overflow-hidden bg-slate-900/50 flex items-center justify-center">
              <img src="${imgSrc}" onerror="this.style.display='none'" class="absolute inset-0 w-full h-full object-cover filter blur-xl opacity-40 scale-110">
              <img src="${imgSrc}" onerror="this.src='${FALLBACK_IMAGE}'" class="absolute inset-0 w-full h-full object-contain transition-transform duration-500 group-hover:scale-105 z-10">
              <div class="absolute top-4 right-4 bg-slate-900/80 backdrop-blur-md text-white px-3.5 py-1.5 rounded-xl font-black text-xs sm:text-sm shadow-xl tracking-widest border border-white/10 z-20 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> ${b.bus_number}
              </div>
            </div>
            <div class="p-5 md:p-6 flex flex-col flex-1 relative z-10">
              <h3 class="font-black text-white text-xl sm:text-2xl mb-4 leading-tight group-hover:text-amber-400 transition-colors">${b.route_name}</h3>
              <div class="flex items-start gap-2.5 text-slate-300 mb-6 flex-1 bg-white/5 p-3.5 rounded-xl border border-white/5">
                <div class="mt-0.5 bg-white/10 p-1 rounded-md shrink-0"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-amber-400"></i></div>
                <p class="text-xs sm:text-sm leading-relaxed line-clamp-3 font-medium" title="${b.stops}"><span class="font-bold text-white">Stops:</span> ${b.stops}</p>
              </div>
              <div class="mt-auto pt-4 ticket-border flex items-center justify-between">
                <div class="flex items-center gap-2 text-slate-400 font-bold text-xs sm:text-sm uppercase tracking-wide">
                  <i data-lucide="clock" class="w-4 h-4 text-amber-400"></i> Departure
                </div>
                <span class="text-xs sm:text-sm font-black text-amber-300 bg-amber-500/10 px-3 py-1.5 rounded-lg border border-amber-500/20 shadow-sm">${b.timing}</span>
              </div>
            </div>
          </div>
        `}).join('');
        lucide.createIcons();
      } catch (err) { grid.innerHTML = '<div class="col-span-full text-center text-red-400 font-bold py-10 glass-card rounded-2xl">Failed to load transport data.</div>'; }
    }
    loadTransport();
  </script>
</body>
</html>

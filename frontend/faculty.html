<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Directory - HIETFINDIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
    <a href="dashboard.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Dashboard
    </a>
    <h1 class="text-xl font-black tracking-tight text-slate-900">Faculty <span class="text-indigo-600">Directory</span></h1>
  </nav>

  <main class="flex-1 max-w-6xl mx-auto w-full p-6 lg:p-10">
    <div class="mb-8">
      <h2 class="text-3xl font-black text-slate-900">Professors & Cabins</h2>
      <p class="text-slate-500 mt-1">Explore department faculty details and cabin locations.</p>
    </div>

    <div id="facultyGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-slate-500 font-bold animate-pulse">Loading directory...</p>
    </div>
  </main>

  <script>
    lucide.createIcons();
    if(!localStorage.getItem('token')) { window.location.href = 'login.html'; }
    const API_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://hietfindit-lqzt.onrender.com/api';

    async function loadFaculty() {
      const grid = document.getElementById('facultyGrid');
      try {
        const res = await fetch(`${API_URL}/faculty`); const data = await res.json();
        if(data.length === 0) return grid.innerHTML = '<p class="text-slate-500">No records found.</p>';
        grid.innerHTML = data.map(f => `
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex items-center gap-5 hover:shadow-md transition">
            <img src="${f.photo || 'https://via.placeholder.com/80'}" class="w-16 h-16 rounded-full object-cover border-2 border-indigo-100 shadow-sm">
            <div>
              <h3 class="font-bold text-slate-900 text-lg">${f.name}</h3>
              <p class="text-xs font-bold text-indigo-600 mt-0.5">${f.designation} • ${f.department}</p>
              <p class="text-xs text-slate-500 mt-2 flex items-center gap-1 bg-slate-50 px-2.5 py-1 rounded-md border border-slate-100 w-fit">
                <i data-lucide="map-pin" class="w-3 h-3 text-indigo-500"></i> ${f.cabin || 'Cabin N/A'}
              </p>
            </div>
          </div>
        `).join('');
        lucide.createIcons();
      } catch (err) {
        grid.innerHTML = '<p class="text-red-500">Failed to load data from server.</p>';
      }
    }
    loadFaculty();
  </script>
</body>
</html>

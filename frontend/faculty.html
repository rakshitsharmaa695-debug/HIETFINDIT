<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Directory - HIETFINDIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Premium Glass Cards */
    .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .glass-card:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(99, 102, 241, 0.5); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5); }
    
    .leadership-card { position: relative; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); }
    .leadership-card::before {
      content: ''; position: absolute; inset: 0; border-radius: 1.5rem; padding: 2px; 
      background: linear-gradient(135deg, #818cf8, #c084fc, #f59e0b);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0.7;
    }
  </style>
</head>
<body class="text-white font-sans min-h-screen flex flex-col relative overflow-x-hidden selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- Cinematic Background -->
  <div class="fixed inset-0 w-full h-full -z-20 overflow-hidden bg-slate-950">
    <img src="1789033601541.jpg" class="absolute inset-0 w-full h-full object-cover scale-110 filter blur-[80px] opacity-30 mix-blend-screen">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/80 via-slate-900/70 to-slate-950/90"></div>
  </div>

  <!-- Glassmorphism Navbar -->
  <nav class="bg-slate-900/40 backdrop-blur-xl border-b border-white/10 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
      <div class="bg-gradient-to-br from-indigo-500 to-blue-500 p-2 rounded-xl text-white font-black text-xs shadow-lg">HF</div>
      <h1 class="text-xl font-black tracking-tight text-white">HIET<span class="text-indigo-400">FINDIT</span></h1>
    </div>
    <div class="hidden md:flex items-center gap-8">
      <a href="courses.html" class="text-sm font-bold text-slate-300 hover:text-white flex items-center gap-1.5 transition-colors"><i data-lucide="book-open" class="w-4 h-4"></i> Courses</a>
      <a href="timetable.html" class="text-sm font-bold text-slate-300 hover:text-white flex items-center gap-1.5 transition-colors"><i data-lucide="calendar" class="w-4 h-4"></i> Timetable</a>
      <a href="faculty.html" class="text-sm font-bold text-white flex items-center gap-1.5 transition-colors"><i data-lucide="users" class="w-4 h-4 text-indigo-400"></i> Faculty</a>
      <a href="transport.html" class="text-sm font-bold text-slate-300 hover:text-white flex items-center gap-1.5 transition-colors"><i data-lucide="bus" class="w-4 h-4"></i> Transport</a>
    </div>
    <div id="navActions" class="flex items-center gap-3"></div>
  </nav>

  <!-- Hero Section -->
  <div class="py-16 px-6 relative text-center z-10">
    <h1 class="text-4xl md:text-5xl lg:text-6xl font-black tracking-tight mb-4 text-white">Leadership & <span class="text-indigo-400">Faculty</span></h1>
    <p class="text-slate-300 max-w-2xl mx-auto text-lg font-medium">Meet the visionary leaders and dedicated educators driving academic excellence.</p>
  </div>

  <main class="flex-1 max-w-7xl mx-auto w-full p-6 lg:p-12 -mt-8 relative z-20">
    
    <!-- 1. LEADERSHIP SECTION -->
    <div id="leadershipSection" class="mb-20 hidden fade-in">
      <div class="text-center mb-10">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-500/10 text-amber-400 text-[10px] font-bold border border-amber-500/20 tracking-widest uppercase mb-3 backdrop-blur-md">
          <i data-lucide="star" class="w-3 h-3"></i> Top Management
        </div>
      </div>
      <div id="leadershipGrid" class="flex flex-wrap justify-center gap-8"></div>
    </div>

    <!-- 2. DEPARTMENTS & FACULTY SECTION -->
    <div class="glass-card rounded-[2rem] p-8 md:p-12 fade-in">
      <div class="text-center mb-10">
        <h2 class="text-3xl font-black text-white tracking-tight">Academic Departments</h2>
      </div>

      <!-- Department Filters -->
      <div id="deptFilters" class="flex flex-wrap justify-center gap-3 mb-12">
        <button class="px-6 py-2.5 rounded-full text-sm font-bold bg-white/10 text-white shadow-md">Loading...</button>
      </div>

      <!-- Faculty Grid -->
      <div id="facultyGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
      
      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-16">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/5 text-slate-400 mb-4 border border-white/10"><i data-lucide="users" class="w-8 h-8"></i></div>
        <h3 class="text-lg font-bold text-white">No Faculty Found</h3>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();
    const token = localStorage.getItem('token'); const userStr = localStorage.getItem('user');
    
    if (!token || !userStr) { window.location.href = 'index.html'; } else {
      const user = JSON.parse(userStr);
      document.getElementById('navActions').innerHTML = `<a href="${user.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html'}" class="bg-white/10 hover:bg-white/20 border border-white/10 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md transition-all flex items-center gap-2 backdrop-blur-md">Dashboard <i data-lucide="layout-dashboard" class="w-4 h-4"></i></a><button onclick="logout()" class="bg-white/5 hover:bg-red-500/20 border border-white/5 hover:border-red-500/30 text-white hover:text-red-400 px-3 py-2 rounded-xl text-sm font-bold transition-all" title="Logout"><i data-lucide="log-out" class="w-4 h-4"></i></button>`;
      lucide.createIcons();
    }
    function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = 'index.html'; }

    const API_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://hietfindit-lqzt.onrender.com/api';
    let allFaculty = []; let departmentsData = {}; let leadershipData = [];

    async function initFaculty() {
      try {
        const res = await fetch(`${API_URL}/faculty`); allFaculty = await res.json(); processFacultyData();
      } catch(err) { document.getElementById('facultyGrid').innerHTML = `<p class="text-red-400 col-span-full text-center font-bold">Failed to connect to server.</p>`; }
    }

    function processFacultyData() {
      leadershipData = []; departmentsData = {};
      const leadershipKeywords = ['director', 'managing director', 'chairman', 'founder', 'principal'];
      
      allFaculty.forEach(fac => {
        const desig = fac.designation.toLowerCase();
        if(leadershipKeywords.some(keyword => desig.includes(keyword)) || /\bmd\b/.test(desig)) leadershipData.push(fac);
        else { const dept = fac.department.trim(); if(!departmentsData[dept]) departmentsData[dept] = []; departmentsData[dept].push(fac); }
      });

      leadershipData.sort((a, b) => {
        const r1 = a.designation.toLowerCase().includes('director') && !a.designation.toLowerCase().includes('managing') ? 1 : (/\bmd\b/.test(a.designation.toLowerCase()) || a.designation.toLowerCase().includes('managing')) ? 2 : 3;
        const r2 = b.designation.toLowerCase().includes('director') && !b.designation.toLowerCase().includes('managing') ? 1 : (/\bmd\b/.test(b.designation.toLowerCase()) || b.designation.toLowerCase().includes('managing')) ? 2 : 3;
        return r1 - r2;
      });

      for (const dept in departmentsData) {
        departmentsData[dept].sort((a, b) => {
          const r1 = a.designation.toLowerCase().includes('hod') ? 1 : a.designation.toLowerCase().includes('dean') ? 2 : a.designation.toLowerCase().includes('professor') && !a.designation.toLowerCase().includes('assistant') ? 3 : 4;
          const r2 = b.designation.toLowerCase().includes('hod') ? 1 : b.designation.toLowerCase().includes('dean') ? 2 : b.designation.toLowerCase().includes('professor') && !b.designation.toLowerCase().includes('assistant') ? 3 : 4;
          return r1 - r2;
        });
      }
      renderLeadership(); renderDepartmentFilters();
    }
    
    function renderLeadership() {
      const leadSection = document.getElementById('leadershipSection'); const leadGrid = document.getElementById('leadershipGrid');
      if(leadershipData.length === 0) { leadSection.classList.add('hidden'); return; }
      leadSection.classList.remove('hidden');
      leadGrid.innerHTML = leadershipData.map(l => `
        <div class="leadership-card rounded-[1.5rem] p-8 w-full max-w-sm flex flex-col items-center text-center shadow-2xl transform transition-transform hover:-translate-y-2">
          <div class="w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-indigo-500 to-amber-500 mb-6 shadow-xl">
            ${l.photo ? `<img src="${l.photo}" class="w-full h-full rounded-full object-cover border-4 border-slate-900">` : `<div class="w-full h-full rounded-full border-4 border-slate-900 bg-slate-800 flex items-center justify-center text-slate-400"><i data-lucide="user" class="w-10 h-10"></i></div>`}
          </div>
          <h3 class="text-2xl font-black text-white mb-1">${l.name}</h3>
          <p class="text-sm font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-amber-400 uppercase tracking-widest">${l.designation}</p>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function renderDepartmentFilters() {
      const depts = Object.keys(departmentsData).sort(); const filterContainer = document.getElementById('deptFilters');
      if(depts.length === 0) { filterContainer.innerHTML = ''; renderFacultyGrid([]); return; }
      filterContainer.innerHTML = depts.map((dept, index) => `<button onclick="selectDepartment('${dept}')" id="btn-${dept.replace(/\s+/g, '-')}" class="dept-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all border ${index === 0 ? 'bg-gradient-to-r from-indigo-500 to-blue-500 text-white border-transparent shadow-lg shadow-indigo-500/30' : 'bg-white/5 text-slate-300 border-white/10 hover:bg-white/10 hover:text-white'}">${dept}</button>`).join('');
      selectDepartment(depts[0]);
    }

    function selectDepartment(deptName) {
      document.querySelectorAll('.dept-btn').forEach(btn => { btn.className = 'dept-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all border bg-white/5 text-slate-300 border-white/10 hover:bg-white/10 hover:text-white'; });
      const activeBtn = document.getElementById(`btn-${deptName.replace(/\s+/g, '-')}`);
      if(activeBtn) activeBtn.className = 'dept-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all border bg-gradient-to-r from-indigo-500 to-blue-500 text-white border-transparent shadow-lg shadow-indigo-500/30 transform scale-105';
      renderFacultyGrid(departmentsData[deptName] || []);
    }

    function renderFacultyGrid(facultyList) {
      const grid = document.getElementById('facultyGrid'); const emptyState = document.getElementById('emptyState');
      if(facultyList.length === 0) { grid.innerHTML = ''; grid.classList.add('hidden'); emptyState.classList.remove('hidden'); return; }
      grid.classList.remove('hidden'); emptyState.classList.add('hidden');
      grid.innerHTML = facultyList.map((f, index) => {
        const isHOD = f.designation.toLowerCase().includes('hod') || f.designation.toLowerCase().includes('head');
        return `
        <div class="glass-card rounded-2xl p-6 flex items-start gap-4 fade-in ${isHOD ? 'border-indigo-500/50 shadow-lg shadow-indigo-500/20' : ''}" style="animation-delay: ${index * 0.05}s">
          <div class="w-16 h-16 rounded-full shrink-0 relative">
            ${isHOD ? `<div class="absolute -top-2 -right-2 bg-amber-500 text-white w-6 h-6 flex items-center justify-center rounded-full shadow-md z-10"><i data-lucide="crown" class="w-3.5 h-3.5"></i></div>` : ''}
            ${f.photo ? `<img src="${f.photo}" class="w-full h-full rounded-full object-cover border-2 ${isHOD ? 'border-indigo-400' : 'border-white/20'}">` : `<div class="w-full h-full rounded-full border-2 ${isHOD ? 'border-indigo-400' : 'border-white/20'} bg-slate-800 flex items-center justify-center text-slate-400"><i data-lucide="user" class="w-6 h-6"></i></div>`}
          </div>
          <div class="flex-1 pt-1">
            <h3 class="font-black text-white leading-tight">${f.name}</h3>
            <p class="${isHOD ? 'text-indigo-400 font-bold' : 'text-slate-400 font-medium'} text-xs mt-1 uppercase tracking-wider">${f.designation}</p>
          </div>
        </div>
      `}).join('');
      lucide.createIcons();
    }
    initFaculty();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Support - HIETFINDIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
    .fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .dark-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
    .dark-input:focus { border-color: #f43f5e; outline: none; box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.2); background: rgba(15, 23, 42, 0.9); }
    
    /* File input styling */
    input[type=file]::file-selector-button {
      background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); color: #fb7185; 
      padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; margin-right: 12px;
    }
    input[type=file]::file-selector-button:hover { background: rgba(244, 63, 94, 0.2); }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col relative overflow-x-hidden selection:bg-rose-500/30 selection:text-rose-200">

  <!-- Cinematic Background -->
  <div class="fixed inset-0 w-full h-full -z-20 overflow-hidden bg-slate-950">
    <img src="1789033601541.jpg" alt="Campus Blur" class="absolute inset-0 w-full h-full object-cover scale-110 filter blur-[80px] opacity-20 mix-blend-screen">
    <div class="absolute inset-0 bg-gradient-to-br from-slate-950/90 via-slate-900/80 to-slate-950/95"></div>
  </div>

  <!-- Glassmorphism Navbar -->
  <nav class="bg-slate-900/40 backdrop-blur-xl border-b border-white/10 px-4 md:px-6 py-4 flex justify-between items-center sticky top-0 z-50 transition-all">
    <a href="dashboard.html" class="bg-white/10 hover:bg-white/20 border border-white/10 text-white px-3 md:px-4 py-2 rounded-xl text-sm font-bold transition-all shadow-sm flex items-center gap-2 group backdrop-blur-md">
      <i data-lucide="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1"></i> <span class="hidden sm:inline">Back to Dashboard</span>
    </a>
    <div class="flex items-center gap-2.5 cursor-pointer" onclick="window.location.href='index.html'">
      <h1 class="text-lg md:text-xl font-black tracking-tight text-white">Student <span class="text-rose-400">Support</span></h1>
      <div class="bg-gradient-to-br from-rose-500 to-red-500 p-2 rounded-xl text-white font-black text-xs shadow-lg shadow-rose-500/30"><i data-lucide="message-square-warning" class="w-4 h-4"></i></div>
    </div>
  </nav>

  <main class="flex-1 max-w-4xl mx-auto w-full p-4 sm:p-6 lg:p-10 relative z-20">
    <div class="mb-10 text-center sm:text-left fade-in">
      <h2 class="text-3xl md:text-4xl font-black text-white tracking-tight mb-2">Raise a Ticket</h2>
      <p class="text-slate-400 font-medium">Facing an issue on campus? Report it here with a photo, and the administration will resolve it.</p>
    </div>

    <div class="glass-card rounded-[2rem] p-6 sm:p-10 shadow-2xl relative overflow-hidden fade-in" style="animation-delay: 0.1s;">
      <div class="absolute top-0 right-0 w-64 h-64 bg-rose-500/20 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>
      
      <form id="complaintForm" class="relative z-10 space-y-6">
        <div>
          <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 px-1">Issue Category / Title</label>
          <div class="relative">
            <i data-lucide="alert-circle" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
            <input type="text" id="cTitle" required placeholder="E.g., Wifi not working in Library" class="w-full dark-input rounded-xl py-3.5 px-4 pl-11 text-sm font-bold shadow-sm">
          </div>
        </div>
        
        <div>
          <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 px-1">Detailed Description</label>
          <div class="relative">
            <i data-lucide="align-left" class="absolute left-4 top-4 w-4 h-4 text-slate-400"></i>
            <textarea id="cDesc" required placeholder="Describe your issue in detail..." class="w-full dark-input rounded-xl py-3.5 px-4 pl-11 text-sm font-medium shadow-sm h-32 resize-none"></textarea>
          </div>
        </div>

        <!-- NEW ATTACHMENT FIELD -->
        <div>
          <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 px-1">Attachment (Screenshot/Photo) <span class="text-slate-500 lowercase normal-case">- Optional</span></label>
          <div class="relative">
            <i data-lucide="paperclip" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
            <input type="file" id="cAttachment" accept="image/*" class="w-full dark-input rounded-xl py-2.5 px-4 pl-11 text-sm font-medium shadow-sm">
          </div>
        </div>

        <div class="pt-4 border-t border-white/10 flex flex-col-reverse sm:flex-row items-center justify-between gap-4">
          <div id="cAlert" class="w-full sm:w-auto opacity-0 transition-opacity duration-300 flex items-center justify-center gap-2 text-sm font-bold px-4 py-3 rounded-xl border">
          </div>
          <button type="submit" id="cSubmitBtn" class="w-full sm:w-auto bg-gradient-to-r from-rose-500 to-red-500 hover:from-rose-600 hover:to-red-600 text-white px-8 py-3.5 rounded-xl text-sm font-bold shadow-lg shadow-rose-500/30 transition-all flex items-center justify-center gap-2 transform hover:-translate-y-1">
            Submit Issue <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </div>
      </form>
    </div>

  </main>

  <script>
    lucide.createIcons();
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');
    if(!token || !userStr) { window.location.href = 'index.html'; }
    
    const user = JSON.parse(userStr);
    const API_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://hietfindit-lqzt.onrender.com/api';
    
    // File to Base64 Converter
    const toBase64 = f => new Promise((res, rej) => { const r = new FileReader(); r.readAsDataURL(f); r.onload = () => res(r.result); });

    function showAlert(msg, isError = false) {
      const box = document.getElementById('cAlert');
      box.innerHTML = `<i data-lucide="${isError ? 'alert-circle' : 'check-circle'}" class="w-5 h-5"></i> ${msg}`;
      box.className = `w-full sm:w-auto transition-opacity duration-300 flex items-center justify-center gap-2 text-sm font-bold px-4 py-3 rounded-xl border opacity-100 ${isError ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'}`;
      lucide.createIcons();
      setTimeout(() => box.classList.add('opacity-0'), 5000);
    }

    document.getElementById('complaintForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('cSubmitBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Sending...'; btn.disabled = true;

      // Check if attachment exists
      let attachmentBase64 = '';
      const fileInput = document.getElementById('cAttachment').files[0];
      if (fileInput) {
        attachmentBase64 = await toBase64(fileInput);
      }

      const bodyData = {
        student_name: user.name || 'Student',
        student_email: user.email,
        title: document.getElementById('cTitle').value,
        description: document.getElementById('cDesc').value,
        attachment: attachmentBase64 // Sending new attachment field
      };

      try {
        const res = await fetch(`${API_URL}/complaints`, {
          method: 'POST', 
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` // SECURITY FIX: Adding Token
          }, 
          body: JSON.stringify(bodyData)
        });
        
        const data = await res.json();
        
        if(res.ok) {
          e.target.reset();
          showAlert('Ticket Submitted Successfully!', false);
        } else {
          // SHOW ACTUAL BACKEND ERROR
          showAlert(data.error || data.message || "Server rejected the request.", true);
        }
      } catch (err) { 
        showAlert("Server connection failed.", true); 
      } finally { 
        btn.innerHTML = originalText; btn.disabled = false; lucide.createIcons(); 
      }
    });
  </script>
</body>
</html>
